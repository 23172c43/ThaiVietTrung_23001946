<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Sản phẩm</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .error-msg { color: red; font-weight: bold; }
        .success-msg { color: green; font-weight: bold; }
        form { margin-bottom: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div id="app">
        <h2>Quản lý Sản phẩm</h2>
        
        <div v-if="message" :class="isSuccess ? 'success-msg' : 'error-msg'">
            {{ message }}
        </div>
        
        <form @submit.prevent="saveProduct">
            <input type="text" v-model="form.name" placeholder="Tên sản phẩm" required>
            <input type="number" v-model="form.price" placeholder="Đơn giá" required>
            <input type="number" v-model="form.stock" placeholder="Số lượng tồn" required>
            <button type="submit">{{ isEditing ? 'Cập nhật' : 'Thêm' }}</button>
            <button type="button" v-if="isEditing" @click="cancelEdit">Hủy</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Tên sản phẩm</th>
                    <th>Đơn giá (đồng)</th>
                    <th>Số lượng tồn</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="product in products" :key="product.id">
                    <td>{{ product.name }}</td>
                    <td>{{ product.price }}</td>
                    <td>{{ product.stock }}</td>
                    <td>
                        <button @click="editProduct(product)">Sửa</button>
                        <button @click="deleteProduct(product.id)">Xóa</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    products: [],
                    form: { id: null, name: '', price: '', stock: '' },
                    isEditing: false,
                    message: '',
                    isSuccess: true
                }
            },
            methods: {
                async fetchProducts() {
                    try {
                        const res = await fetch('api/products.php');
                        const result = await res.json();
                        if (result.success) {
                            this.products = result.data;
                        }
                    } catch (error) {
                        this.showMessage('Lỗi kết nối đến API', false);
                    }
                },
                async saveProduct() {
                    const method = this.isEditing ? 'PUT' : 'POST';
                    const url = this.isEditing ? `api/products.php?id=${this.form.id}` : 'api/products.php';
                    
                    try {
                        const res = await fetch(url, {
                            method: method,
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                name: this.form.name,
                                price: parseInt(this.form.price),
                                stock: parseInt(this.form.stock)
                            })
                        });
                        const result = await res.json();
                        
                        if (result.success) {
                            this.showMessage(result.message, true);
                            this.fetchProducts();
                            this.cancelEdit();
                        } else {
                            this.showMessage(result.message, false);
                        }
                    } catch (error) {
                        this.showMessage('Lỗi gửi yêu cầu', false);
                    }
                },
                editProduct(product) {
                    this.form = { ...product };
                    this.isEditing = true;
                },
                cancelEdit() {
                    this.form = { id: null, name: '', price: '', stock: '' };
                    this.isEditing = false;
                },
                async deleteProduct(id) {
                    if (confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')) {
                        try {
                            const res = await fetch(`api/products.php?id=${id}`, {
                                method: 'DELETE'
                            });
                            const result = await res.json();
                            
                            if (result.success) {
                                this.showMessage(result.message, true);
                                this.fetchProducts();
                            } else {
                                this.showMessage(result.message, false);
                            }
                        } catch (error) {
                            this.showMessage('Lỗi gửi yêu cầu', false);
                        }
                    }
                },
                showMessage(msg, success) {
                    this.message = msg;
                    this.isSuccess = success;
                    setTimeout(() => this.message = '', 4000);
                }
            },
            mounted() {
                this.fetchProducts();
            }
        }).mount('#app');
    </script>
</body>
</html>
